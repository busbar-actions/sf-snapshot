name: 'Busbar — sf-snapshot'
description: 'Create a Salesforce scratch-org snapshot (OrgSnapshot) via direct API. Auths the DevHub via busbar-auth.'
author: 'Busbar'

# AUTH (self-mint via OIDC — the DEFAULT, primary path): set `target-instance`
# to the Busbar-equipped DevHub's instance URL (e.g. busbar-pilot-demo2) and
# grant `permissions:
# id-token: write` in the caller job. The binary mints its OWN short-lived
# Salesforce token IN-PROCESS from the runner's GitHub OIDC id-token, uses it,
# and revokes + zeroizes it at exit (SalesforceSession::dispose). No Salesforce
# access token is ever handed to a script, written to GITHUB_ENV, or passed as
# an action input/output. There is NO org-auth handoff step.
inputs:
  target-instance:
    description: >-
      PRIMARY OIDC path: instance URL of the Busbar-equipped DevHub to mint a
      short-lived token against (e.g. busbar-pilot-demo2). Passed to the binary as
      SF_INSTANCE_URL; with
      `id-token: write` granted, busbar-auth OIDC-exchanges in-process (no
      SF_ACCESS_TOKEN handoff).
    required: false
    default: ''
  name:
    description: 'Snapshot name (unique within the DevHub).'
    required: true
  source-org:
    description: '15- or 18-char id of the source scratch org (the `ScratchOrg` field from sf-org-create output).'
    required: true
  description:
    description: 'Optional description.'
    required: false
    default: ''
  content:
    description: 'Optional content selector (usually `metadatadata`).'
    required: false
    default: ''
  poll-timeout-secs:
    description: 'Seconds to wait for the snapshot to reach Active (can take 30+ min for large orgs).'
    required: false
    default: '3600'
  result-output:
    description: 'Path to write the snapshot result JSON.'
    required: false
    default: '.busbar/snapshot-result.json'
  version:
    description: 'Release tag of the sf-snapshot binary. Falls back to env.BUSBAR_ACTION_VERSION, then "latest".'
    required: false
    default: ''
  binary-repo:
    description: 'GitHub repo hosting prebuilt binary releases. Falls back to env.BUSBAR_ACTION_REPO, then busbar-actions/actions-dist.'
    required: false
    default: ''

outputs:
  snapshot-id:
    description: 'OrgSnapshot record id (pass to sf-org-delete --snapshot-id when retiring).'
    value: ${{ steps.snap.outputs.org_snapshot_id }}
  status:
    description: 'Final status (Active on success).'
    value: ${{ steps.snap.outputs.status }}
  snapshot-name:
    description: 'Canonical snapshot name.'
    value: ${{ steps.snap.outputs.snapshot_name }}
  rotated:
    description: '"true" when zero-downtime rotation was used.'
    value: ${{ steps.snap.outputs.rotated }}
  expiration-date:
    description: 'Snapshot expiration date when provided by Salesforce.'
    value: ${{ steps.snap.outputs.expiration_date }}
  result-path:
    description: 'Path to the JSON file containing the snapshot result.'
    value: ${{ inputs.result-output }}

# The binary owns all logic and UX: it reads its inputs from INPUT_*, runs the
# zero-downtime snapshot rotation, writes the JSON result, GITHUB_OUTPUT, the
# step summary and an annotation. This action only installs it and passes inputs
# (plus the SF/OIDC auth env) through.
runs:
  using: 'composite'
  steps:
    - name: Install binary
      uses: busbar-actions/setup@main
      with:
        binary: sf-snapshot
        version: ${{ inputs.version || env.BUSBAR_ACTION_VERSION || 'latest' }}
        binary-repo: ${{ inputs.binary-repo || env.BUSBAR_ACTION_REPO || 'busbar-actions/actions-dist' }}

    - name: Snapshot
      id: snap
      shell: bash
      # AUTH (default): self-mint via OIDC — SF_INSTANCE_URL = the Busbar-equipped DevHub
      # (`target-instance`); caller grants `id-token: write` so the runner injects
      # ACTIONS_ID_TOKEN_REQUEST_*; the binary mints + revokes its own short-lived
      # token in-process. We do NOT set SF_ACCESS_TOKEN here (no token handoff,
      # nothing written to GITHUB_ENV); it is only populated from the optional
      # `sf-access-token` local-dev override input.
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_SOURCE_ORG: ${{ inputs.source-org }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_CONTENT: ${{ inputs.content }}
        INPUT_POLL_TIMEOUT_SECS: ${{ inputs.poll-timeout-secs }}
        INPUT_RESULT_OUTPUT: ${{ inputs.result-output }}
        # DevHub instance URL: optional override wins, else `target-instance`.
        SF_INSTANCE_URL: ${{ inputs.target-instance || env.SF_INSTANCE_URL }}
        BUSBAR_ECA_CLIENT_ID: ${{ env.BUSBAR_ECA_CLIENT_ID }}
        BUSBAR_TOKEN_HANDLER: ${{ env.BUSBAR_TOKEN_HANDLER }}
        BUSBAR_OIDC_AUDIENCE: ${{ env.BUSBAR_OIDC_AUDIENCE }}
        # GitHub injects these only when the caller job grants id-token: write.
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: |
        set -euo pipefail
        echo "Creating OrgSnapshot '${INPUT_NAME}' from source scratch org '${INPUT_SOURCE_ORG}' via the DevHub at '${SF_INSTANCE_URL}' (content='${INPUT_CONTENT}', poll-timeout=${INPUT_POLL_TIMEOUT_SECS}s)"
        # The binary owns the zero-downtime rotation, polling to Active, OIDC
        # self-mint, the result JSON, and GITHUB_OUTPUT/summary/annotation. Any
        # non-zero exit aborts the step.
        sf-snapshot
        echo "::group::Snapshot result"
        echo "OrgSnapshot=${{ steps.snap.outputs.org_snapshot_id }} name=${{ steps.snap.outputs.snapshot_name }} status=${{ steps.snap.outputs.status }} rotated=${{ steps.snap.outputs.rotated }} expires=${{ steps.snap.outputs.expiration_date }}"
        echo "Snapshot result JSON written to '${INPUT_RESULT_OUTPUT}':"
        ls -la "${INPUT_RESULT_OUTPUT}"
        cat "${INPUT_RESULT_OUTPUT}"
        echo "::endgroup::"

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: sf-snapshot-${{ inputs.name }}-result
        path: ${{ inputs.result-output }}
        if-no-files-found: error
