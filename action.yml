name: 'Busbar — sf-snapshot'
description: 'Create a Salesforce scratch-org snapshot (OrgSnapshot) via direct API. Auths the DevHub via busbar-auth.'
author: 'Busbar'

inputs:
  name:
    description: 'Snapshot name (unique within the DevHub).'
    required: true
  source-org:
    description: '15- or 18-char id of the source scratch org (the `ScratchOrg` field from sf-org-create output).'
    required: true
  description:
    description: 'Optional description.'
    required: false
    default: ''
  content:
    description: 'Optional content selector (usually `metadatadata`).'
    required: false
    default: ''
  poll-timeout-secs:
    description: 'Seconds to wait for the snapshot to reach Active (can take 30+ min for large orgs).'
    required: false
    default: '3600'
  result-output:
    description: 'Path to write the snapshot result JSON.'
    required: false
    default: '.busbar/snapshot-result.json'
  version:
    description: 'Release tag of the sf-snapshot binary.'
    required: false
    default: 'latest'
  binary-repo:
    description: 'GitHub repo hosting prebuilt binary releases.'
    required: false
    default: 'busbar-actions/actions-dist'

outputs:
  snapshot-id:
    description: 'OrgSnapshot record id (pass to sf-org-delete --snapshot-id when retiring).'
    value: ${{ steps.snap.outputs.org_snapshot_id }}
  status:
    description: 'Final status (Active on success).'
    value: ${{ steps.snap.outputs.status }}
  snapshot-name:
    description: 'Canonical snapshot name.'
    value: ${{ steps.snap.outputs.snapshot_name }}
  rotated:
    description: '"true" when zero-downtime rotation was used.'
    value: ${{ steps.snap.outputs.rotated }}
  expiration-date:
    description: 'Snapshot expiration date when provided by Salesforce.'
    value: ${{ steps.snap.outputs.expiration_date }}
  result-path:
    description: 'Path to the JSON file containing the snapshot result.'
    value: ${{ inputs.result-output }}

# The binary owns all logic and UX: it reads its inputs from INPUT_*, runs the
# zero-downtime snapshot rotation, writes the JSON result, GITHUB_OUTPUT, the
# step summary and an annotation. This action only installs it and passes inputs
# (plus the SF/OIDC auth env) through.
runs:
  using: 'composite'
  steps:
    - name: Set up sf-snapshot
      uses: busbar-actions/setup@main
      with:
        binary: sf-snapshot
        version: ${{ inputs.version }}
        binary-repo: ${{ inputs.binary-repo }}

    - name: Create snapshot
      id: snap
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_SOURCE_ORG: ${{ inputs.source-org }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_CONTENT: ${{ inputs.content }}
        INPUT_POLL_TIMEOUT_SECS: ${{ inputs.poll-timeout-secs }}
        INPUT_RESULT_OUTPUT: ${{ inputs.result-output }}
        SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}
        SF_INSTANCE_URL: ${{ env.SF_INSTANCE_URL }}
        BUSBAR_ECA_CLIENT_ID: ${{ env.BUSBAR_ECA_CLIENT_ID }}
        BUSBAR_TOKEN_HANDLER: ${{ env.BUSBAR_TOKEN_HANDLER }}
        BUSBAR_OIDC_AUDIENCE: ${{ env.BUSBAR_OIDC_AUDIENCE }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: sf-snapshot
